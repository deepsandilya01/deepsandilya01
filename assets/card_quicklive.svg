<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" font-family="Courier New, Courier, DejaVu Sans Mono, monospace">
<rect x="3" y="3" width="794" height="244" rx="12" fill="#050805" stroke="#00FF41" stroke-width="1.5" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></rect>
<rect x="3" y="3" width="794" height="244" rx="12" fill="none" stroke="#00FF41" stroke-opacity="0.25" stroke-width="6"><animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="2.6s" repeatCount="indefinite"/></rect>
<text x="30" y="44" font-size="20" font-weight="bold" fill="#00FF41">[02] QuickLive: Deployment Management Platform</text>
<text x="30" y="68" font-size="13" fill="#00a82d">STACK: React.js | Redux Toolkit | Socket.io | REST APIs | Tailwind CSS</text>
<line x1="30" y1="80" x2="770" y2="80" stroke="#00FF41" stroke-opacity="0.3"/>
<text x="30" y="108" font-size="14" opacity="0"><tspan fill="#00FF41">&gt; </tspan><tspan fill="#C9D1D9">Real-time dashboards to monitor and manage live app deployments</tspan><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.4s" fill="freeze"/></text>
<text x="30" y="134" font-size="14" opacity="0"><tspan fill="#00FF41">&gt; </tspan><tspan fill="#C9D1D9">Redux Toolkit state kept in sync with live deployment status</tspan><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.4s" fill="freeze"/></text>
<text x="30" y="160" font-size="14" opacity="0"><tspan fill="#00FF41">&gt; </tspan><tspan fill="#C9D1D9">REST API + third-party integrations | Socket.io live updates</tspan><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.4s" fill="freeze"/></text>
<text x="30" y="186" font-size="14" opacity="0"><tspan fill="#00FF41">&gt; </tspan><tspan fill="#C9D1D9">Team workflow on Git/GitHub with sprint-based iterations</tspan><animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.4s" fill="freeze"/></text>
<circle cx="38" cy="224" r="5" fill="#00FF41"><animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="54" y="229" font-size="14" font-weight="bold" fill="#00FF41">LIVE  quicklive.tech</text>
<text x="776" y="228" font-size="12" text-anchor="end" fill="#00a82d">[ CLICK TO OPEN ]<animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></text>
<rect x="4" y="4" width="792" height="2" fill="#00FF41" opacity="0.12"><animate attributeName="y" from="4" to="244" dur="4s" repeatCount="indefinite"/></rect>
</svg>